<header class="top-navigation">
  <div class="top-navigation__inner">

    <!-- BRAND -->
    <a
      [routerLink]="['/dashboard']"
      class="brand"
      aria-label="CareerFlow home"
    >
      <span
        class="brand__mark"
        aria-hidden="true"
      >
        C
      </span>

      <span class="brand__name">
        CareerFlow
      </span>
    </a>


    <!-- MAIN NAVIGATION -->
    <nav
      class="main-navigation"
      aria-label="Main navigation"
    >

      <!-- HOME -->
      <a
        [routerLink]="['/dashboard']"
        routerLinkActive="main-navigation__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="main-navigation__link"
      >
        <span
          class="main-navigation__icon"
          aria-hidden="true"
        >
          ⌂
        </span>

        <span>
          Home
        </span>
      </a>


      <!-- DISCOVER -->
      <a
        [routerLink]="['/discover']"
        routerLinkActive="main-navigation__link--active"
        class="main-navigation__link"
      >
        <span
          class="main-navigation__icon"
          aria-hidden="true"
        >
          ◎
        </span>

        <span>
          Discover
        </span>
      </a>


      <!-- COLLABORATE -->
      <a
        [routerLink]="['/collaborate']"
        routerLinkActive="main-navigation__link--active"
        class="main-navigation__link"
      >
        <span
          class="main-navigation__icon"
          aria-hidden="true"
        >
          ◇
        </span>

        <span>
          Collaborate
        </span>
      </a>


      <!-- NETWORK -->
      <a
        [routerLink]="['/network']"
        routerLinkActive="main-navigation__link--active"
        class="main-navigation__link"
      >
        <span
          class="main-navigation__icon"
          aria-hidden="true"
        >
          ⌁
        </span>

        <span>
          Network
        </span>
      </a>

    </nav>


    <!-- RIGHT SIDE -->
    <div class="navigation-actions">

      <!-- SEARCH -->
      <label class="navigation-search">

        <span aria-hidden="true">
          ⌕
        </span>

        <input
          type="search"
          placeholder="Search people or skills"
          aria-label="Search CareerFlow"
        />

      </label>


      <!-- NOTIFICATIONS -->
      <a
        [routerLink]="['/notifications']"
        routerLinkActive="navigation-action--active"
        class="navigation-action"
        aria-label="Notifications"
        title="Notifications"
      >
        <span
          class="notification-icon"
          aria-hidden="true"
        >
          ♢
        </span>

        @if (notificationCount > 0) {
          <span class="notification-badge">
            {{ notificationCount }}
          </span>
        }
      </a>


      <!-- PROFILE -->
      <a
        [routerLink]="['/profile']"
        routerLinkActive="navigation-avatar--active"
        class="navigation-avatar"
        aria-label="View profile"
        title="Profile"
      >
        MF
      </a>

    </div>

  </div>
</header>
